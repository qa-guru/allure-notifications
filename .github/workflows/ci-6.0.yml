# 6.0 TypeScript monorepo CI (master + feature/6.0* + quality contour lines).
# Java 5.0.8 jar CI stays in build.yml (master) — do not merge jobs.
# Q1: Allure results + generate + soft c8 coverage artifacts (no % gate).

name: CI 6.0 (TypeScript)

on:
  push:
    branches:
      - master
      - 'feature/6.0*'
      - 'feature/builder-ts'
      - 'feature/quality-*'
  pull_request:
    branches:
      - 'feature/6.0*'
      - 'feature/builder-ts'
      - 'feature/quality-*'
      - master
    paths:
      - 'packages/**'
      - 'apps/**'
      - 'scripts/**'
      - 'c8.config.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/ci-6.0.yml'
  workflow_dispatch:

concurrency:
  group: ci-6.0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pnpm test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @allure-notifications/builder exec playwright install chromium --with-deps

      # Workspace package exports point at dist/; emit before typecheck (fresh CI has no dist).
      - name: Build (packages + builder emit)
        run: pnpm build

      - name: Typecheck (packages + builder, typescript@7)
        run: pnpm typecheck

      - name: Test (packages + builder unit/e2e → allure-results)
        env:
          CI: true
          PLAYWRIGHT_HEADLESS: '1'
          ALLURE_RESULTS_DIR: ${{ github.workspace }}/allure-results
        run: pnpm test

      - name: Coverage (packages, soft — no % gate)
        env:
          CI: true
          ALLURE_RESULTS_DIR: ${{ github.workspace }}/allure-results
        run: pnpm coverage

      - name: Allure generate
        run: pnpm allure:generate

      - name: Upload allure-results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload allure-report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 7
