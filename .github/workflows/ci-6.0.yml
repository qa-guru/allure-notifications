# 6.0 TypeScript monorepo CI (feature/6.0* line).
# Java 5.0.8 jar CI stays in build.yml (master only) — do not merge jobs.

name: CI 6.0 (TypeScript)

on:
  push:
    branches:
      - 'feature/6.0*'
  pull_request:
    branches:
      - 'feature/6.0*'
      - master
    paths:
      - 'packages/**'
      - 'apps/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/ci-6.0.yml'
  workflow_dispatch:

concurrency:
  group: ci-6.0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pnpm test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @allure-notifications/builder exec playwright install chromium --with-deps

      - name: Test (packages + builder unit/e2e)
        env:
          CI: true
          PLAYWRIGHT_HEADLESS: '1'
        run: pnpm test
