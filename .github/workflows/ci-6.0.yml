# 6.0 TypeScript monorepo CI (master + feature/6.0* + quality contour lines).
# Java 5.0.8 jar CI stays in build.yml (master) — do not merge jobs.
# Q1: Allure results + generate + soft c8 coverage artifacts (no % gate).
# Q2: Sonar upload + sonar-gate-wait (soft SONAR_REQUIRED=false).
# Q3: TestOps upload+close via allurectl (informational; skip without ALLURE_*).
# Q4: Telegram collage dry-run (PR) / live (master + workflow_dispatch; never forks).

name: CI 6.0 (TypeScript)

on:
  push:
    branches:
      - master
      - 'feature/6.0*'
      - 'feature/builder-ts'
      - 'feature/quality-*'
  pull_request:
    branches:
      - 'feature/6.0*'
      - 'feature/builder-ts'
      - 'feature/quality-*'
      - master
    paths:
      - 'packages/**'
      - 'apps/**'
      - 'scripts/**'
      - 'config/ci-telegram.json'
      - 'c8.config.json'
      - 'sonar-project.properties'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/ci-6.0.yml'
  workflow_dispatch:

concurrency:
  group: ci-6.0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pnpm test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @allure-notifications/builder exec playwright install chromium --with-deps

      # Workspace package exports point at dist/; emit before typecheck (fresh CI has no dist).
      - name: Build (packages + builder emit)
        run: pnpm build

      - name: Typecheck (packages + builder, typescript@7)
        run: pnpm typecheck

      - name: Test (packages + builder unit/e2e → allure-results)
        env:
          CI: true
          PLAYWRIGHT_HEADLESS: '1'
          ALLURE_RESULTS_DIR: ${{ github.workspace }}/allure-results
        run: pnpm test

      - name: Coverage (packages, soft — no % gate)
        env:
          CI: true
          ALLURE_RESULTS_DIR: ${{ github.workspace }}/allure-results
        run: pnpm coverage

      - name: Allure generate
        run: pnpm allure:generate

      - name: Upload allure-results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload allure-report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 7

  sonar:
    name: Sonar (soft)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Forks: job still runs for visibility, but never receives SONAR_TOKEN (soft-skip in script).

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download coverage
        uses: actions/download-artifact@v8
        with:
          name: coverage
          path: coverage/

      - name: Sonar scan + gate (soft)
        env:
          # Never pass token on fork PRs (secrets are empty there anyway; explicit for clarity).
          SONAR_TOKEN: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.SONAR_TOKEN || '' }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonar.qa.guru' }}
          SONAR_REQUIRED: ${{ vars.SONAR_REQUIRED || 'false' }}
          SONAR_PROJECT_KEY: allure-notifications
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: bash scripts/ci-sonar.sh

      - name: Job summary
        if: always()
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonar.qa.guru' }}
        run: |
          {
            echo "## Sonar (soft)"
            echo ""
            echo "- projectKey: \`allure-notifications\`"
            echo "- host: \`${SONAR_HOST_URL}\`"
            echo "- dashboard: ${SONAR_HOST_URL%/}/dashboard?id=allure-notifications"
            echo "- SONAR_REQUIRED: \`${{ vars.SONAR_REQUIRED || 'false' }}\`"
            echo "- commit: \`${GITHUB_SHA:0:7}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  testops:
    name: TestOps (informational)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Informational — never a merge blocker. Forks / missing ALLURE_* → soft-skip.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download allure-results
        uses: actions/download-artifact@v8
        with:
          name: allure-results
          path: allure-results/

      - name: Gate (forks / secrets / results)
        id: gate
        env:
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          ALLURE_PROJECT_ID: ${{ vars.ALLURE_PROJECT_ID }}
          # Never pass token on fork PRs.
          ALLURE_TOKEN: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.ALLURE_TOKEN || '' }}
        run: |
          if [[ "$IS_FORK" == "true" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reason=fork" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "${ALLURE_PROJECT_ID}" || -z "${ALLURE_TOKEN}" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reason=missing-secrets" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! -d allure-results ]] || [[ -z "$(ls -A allure-results 2>/dev/null)" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reason=no-results" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "reason=upload" >> "$GITHUB_OUTPUT"

      - name: Install allurectl
        if: steps.gate.outputs.skip == 'false'
        continue-on-error: true
        id: setup-allurectl
        uses: allure-framework/setup-allurectl@v1
        with:
          allure-endpoint: ${{ vars.ALLURE_ENDPOINT || 'https://allure.qa.guru' }}
          allure-token: ${{ secrets.ALLURE_TOKEN }}
          allure-project-id: ${{ vars.ALLURE_PROJECT_ID }}

      - name: Upload results to Allure TestOps
        if: steps.gate.outputs.skip == 'false' && steps.setup-allurectl.outcome == 'success'
        continue-on-error: true
        id: testops-upload
        env:
          ALLURE_ENDPOINT: ${{ vars.ALLURE_ENDPOINT || 'https://allure.qa.guru' }}
          ALLURE_PROJECT_ID: ${{ vars.ALLURE_PROJECT_ID }}
        run: |
          set +e
          export ALLURE_LAUNCH_NAME="allure-notifications · ${{ github.ref_name }} · ${{ github.sha }}"
          allurectl upload allure-results 2>&1 | tee allurectl-upload.log
          UPLOAD_EXIT=${PIPESTATUS[0]}
          echo "upload_exit=${UPLOAD_EXIT}" >> "$GITHUB_OUTPUT"
          if [[ "$UPLOAD_EXIT" -eq 0 ]]; then
            LAUNCH_URL=$(grep -Eo 'https://[^ ]+/launch/[0-9]+' allurectl-upload.log | head -1 || true)
            if [[ -z "$LAUNCH_URL" ]] && allurectl job-run env >/tmp/allure-env 2>/dev/null; then
              # shellcheck disable=SC1091
              source /tmp/allure-env
              LAUNCH_URL="${ALLURE_LAUNCH_URL:-}"
            fi
            if [[ -n "$LAUNCH_URL" ]]; then
              echo "launch_url=${LAUNCH_URL}" >> "$GITHUB_OUTPUT"
            fi
          fi
          set -e

      - name: Close TestOps launch
        if: >-
          steps.gate.outputs.skip == 'false' &&
          steps.testops-upload.outcome == 'success' &&
          steps.testops-upload.outputs.launch_url != ''
        continue-on-error: true
        env:
          ALLURE_ENDPOINT: ${{ vars.ALLURE_ENDPOINT || 'https://allure.qa.guru' }}
          ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
          LAUNCH_URL: ${{ steps.testops-upload.outputs.launch_url }}
        run: |
          LAUNCH_ID="${LAUNCH_URL##*/}"
          curl -fsS -X POST \
            "${ALLURE_ENDPOINT%/}/api/rs/launch/${LAUNCH_ID}/close" \
            -H "Authorization: Api-Token ${ALLURE_TOKEN}" \
            -H "Accept: application/json" \
            -H "User-Agent: Mozilla/5.0 (compatible; qa-guru-ci/1.0)"

      - name: Job summary
        if: always()
        env:
          ALLURE_ENDPOINT: ${{ vars.ALLURE_ENDPOINT || 'https://allure.qa.guru' }}
          ALLURE_PROJECT_ID: ${{ vars.ALLURE_PROJECT_ID }}
          GATE_SKIP: ${{ steps.gate.outputs.skip }}
          GATE_REASON: ${{ steps.gate.outputs.reason }}
          LAUNCH_URL: ${{ steps.testops-upload.outputs.launch_url }}
        run: |
          {
            echo "## TestOps (informational)"
            echo ""
            echo "- endpoint: \`${ALLURE_ENDPOINT}\`"
            echo "- project id: \`${ALLURE_PROJECT_ID:-unset}\`"
            echo "- project: ${ALLURE_ENDPOINT%/}/project/${ALLURE_PROJECT_ID}"
            if [[ "${GATE_SKIP}" == "true" ]]; then
              echo "- status: soft-skip (\`${GATE_REASON}\`)"
            elif [[ -n "${LAUNCH_URL}" ]]; then
              echo "- status: uploaded"
              echo "- launch: [${LAUNCH_URL}](${LAUNCH_URL})"
            else
              echo "- status: upload attempted (see job log; not a merge blocker)"
            fi
            echo "- commit: \`${GITHUB_SHA:0:7}\`"
            echo "- launch name: \`allure-notifications · ${{ github.ref_name }} · ${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  telegram:
    name: Telegram (dry-run / live)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # PR / feature push: --dry-run (wiring must pass).
    # master + workflow_dispatch: --live when TELEGRAM_* present; else soft-skip.
    # Forks: never --live.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download allure-report
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: allure-report
          path: allure-report/

      - name: Download allure-results
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: allure-results
          path: allure-results/

      - name: Gate (mode)
        id: gate
        env:
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          # Never pass token on fork PRs.
          TELEGRAM_BOT_TOKEN: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN) || '' }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Default: dry-run (PR + feature branches). Live only master push or workflow_dispatch.
          MODE=dry-run
          REASON=dry-run
          if [[ "$IS_FORK" == "true" ]]; then
            MODE=dry-run
            REASON=fork-dry-run
          elif [[ "$EVENT_NAME" == "workflow_dispatch" || ( "$EVENT_NAME" == "push" && "$REF_NAME" == "master" ) ]]; then
            if [[ -n "${TELEGRAM_BOT_TOKEN}" && -n "${TELEGRAM_CHAT_ID}" ]]; then
              MODE=live
              REASON=live
            else
              MODE=skip
              REASON=missing-secrets
            fi
          fi
          echo "mode=${MODE}" >> "$GITHUB_OUTPUT"
          echo "reason=${REASON}" >> "$GITHUB_OUTPUT"
          echo "Gate: mode=${MODE} reason=${REASON}"

      - name: Send Telegram collage
        id: send
        if: steps.gate.outputs.mode != 'skip'
        env:
          MODE: ${{ steps.gate.outputs.mode }}
          CLI_PIN: '6.0.4'
          REF_NAME: ${{ github.ref_name }}
          SHORT_SHA: ${{ github.sha }}
          BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TELEGRAM_BOT_TOKEN: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN) || '' }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '-1004381150566' }}
          TELEGRAM_TOPIC_ID: ${{ vars.TELEGRAM_TOPIC_ID || vars.TELEGRAM_ALLURE_NOTIFICATIONS_TOPIC_ID || '34' }}
        run: bash scripts/ci-telegram.sh

      - name: Upload collage artifact
        if: ${{ !cancelled() && steps.send.outputs.collage != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: collage-telegram
          path: collage-telegram.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Job summary
        if: always()
        env:
          GATE_MODE: ${{ steps.gate.outputs.mode }}
          GATE_REASON: ${{ steps.gate.outputs.reason }}
          SEND_MODE: ${{ steps.send.outputs.mode }}
          SEND_SOURCE: ${{ steps.send.outputs.source }}
          MESSAGE_ID: ${{ steps.send.outputs.message_id }}
          SEND_EXIT: ${{ steps.send.outputs.send_exit }}
        run: |
          {
            echo "## Telegram (Q4)"
            echo ""
            echo "- topic: slug \`allure-notifications\` → id **34** (ADR 008)"
            echo "- CLI pin: \`allure-notifications@6.0.4\`"
            echo "- gate: \`${GATE_MODE}\` (\`${GATE_REASON}\`)"
            if [[ "${GATE_MODE}" == "skip" ]]; then
              echo "- status: soft-skip (missing TELEGRAM_* — not a merge blocker)"
            else
              echo "- send mode: \`${SEND_MODE:-${GATE_MODE}}\`"
              echo "- config source: \`${SEND_SOURCE:-n/a}\`"
              if [[ -n "${MESSAGE_ID}" ]]; then
                echo "- status: live sendPhoto ok"
                echo "- message_id: \`${MESSAGE_ID}\`"
              elif [[ "${GATE_MODE}" == "dry-run" || "${SEND_MODE}" == "dry-run" ]]; then
                if [[ "${SEND_EXIT}" == "0" ]]; then
                  echo "- status: dry-run ok (no network)"
                else
                  echo "- status: dry-run failed (wiring — fix required)"
                fi
              else
                echo "- status: live attempted (see job log; soft on API blip)"
              fi
            fi
            echo "- commit: \`${GITHUB_SHA:0:7}\`"
          } >> "$GITHUB_STEP_SUMMARY"
