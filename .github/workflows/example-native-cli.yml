name: Example — native npm CLI

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Delivery mode
        type: choice
        options:
          - dry-run
          - mock
          - live
        default: dry-run

permissions:
  contents: read

jobs:
  native-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Prepare dogfood consumer
        run: |
          mkdir -p build/example-native/notifications
          cp -R packages/core/test/fixtures/dogfood-results build/example-native/allure-results
          cp examples/github-actions/notifications/config.json build/example-native/notifications/config.json
          cp .github/examples/allure-notifications/allurerc.mjs build/example-native/allurerc.mjs

      - name: Install published packages
        working-directory: build/example-native
        run: |
          npm init -y >/dev/null
          npm install --no-save --package-lock=false \
            allure@3.14.3 \
            allure-notifications@6.0.13

      - name: Generate report
        working-directory: build/example-native
        run: npx --no-install allure generate allure-results --config allurerc.mjs

      - name: Send with native CLI
        working-directory: build/example-native
        env:
          NOTIFICATION_MODE: ${{ inputs.mode }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_ID: ${{ vars.TELEGRAM_TOPIC_ID }}
          BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          npx --no-install allure-notifications send \
            --config notifications/config.json \
            --allure-folder allure-report/awesome \
            --allure-results-folder allure-results \
            --project "Native CLI #${GITHUB_RUN_NUMBER}" \
            --build-url "${BUILD_URL}" \
            "--${NOTIFICATION_MODE}" \
            --out collage-native.png

      - uses: ./.github/actions/assert-collage
        with:
          path: build/example-native/collage-native.png

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: example-native-cli
          path: |
            build/example-native/collage-native.png
            build/example-native/allure-report/
          if-no-files-found: error
          retention-days: 7
