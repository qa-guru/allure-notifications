<!DOCTYPE html>
<html lang="ru">
<head>
  <link rel="icon" type="image/svg+xml" href="vendor/design-system/assets/qa-guru-logo.svg" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resize handle variants · ANB</title>
  <link rel="stylesheet" href="vendor/design-system/css/tokens.css" />
  <link rel="stylesheet" href="vendor/design-system/css/page.css" />
  <link rel="stylesheet" href="vendor/design-system/css/text.css" />
  <link rel="stylesheet" href="vendor/design-system/css/link.css" />
  <link rel="stylesheet" href="vendor/design-system/css/button.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gridstack@11.3.0/dist/gridstack.min.css" />
  <link rel="stylesheet" href="css/app.css" />
  <style>
    body {
      margin: 0;
      background: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-sans, system-ui, sans-serif);
    }
    .rhv-page {
      max-width: 1180px;
      margin: 0 auto;
      padding: 24px 20px 48px;
    }
    .rhv-page h1 {
      margin: 0 0 6px;
      font-size: 1.25rem;
    }
    .rhv-page .rhv-lead {
      margin: 0 0 18px;
      color: var(--color-text-muted);
      font-size: 0.875rem;
      max-width: 62ch;
    }
    .rhv-note {
      margin: 0 0 20px;
      padding: 10px 12px;
      border-left: 3px solid var(--color-accent, #2563eb);
      background: rgba(37, 99, 235, 0.08);
      font-size: 0.8125rem;
    }
    .rhv-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }
    .rhv-card {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .rhv-card__meta {
      font-size: 0.75rem;
      color: var(--color-text-muted);
    }
    .rhv-card__meta strong {
      color: var(--color-text);
      font-weight: 600;
    }
    .rhv-demo {
      position: relative;
      height: 160px;
      border-radius: 6px;
      background:
        linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px),
        #1a2330;
      background-size: 24px 24px, 24px 24px, auto;
      padding: 10px;
    }
    html.theme-light .rhv-demo {
      background:
        linear-gradient(rgba(26,35,48,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(26,35,48,0.06) 1px, transparent 1px),
        #e8edf4;
      background-size: 24px 24px, 24px 24px, auto;
    }
    .rhv-demo .anb-canvas {
      position: relative;
      width: 100%;
      height: 100%;
      background: transparent;
    }
    .rhv-demo .grid-stack {
      position: relative;
      width: 100%;
      height: 100%;
      background: transparent;
    }
    .rhv-demo .grid-stack-item {
      position: absolute !important;
      inset: 0 !important;
      width: auto !important;
      height: auto !important;
    }
    .rhv-demo .grid-stack-item-content {
      inset: 0;
      display: flex;
      flex-direction: column;
      background: #2a3140;
      color: #fff;
      border-radius: 4px;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
      overflow: hidden;
    }
    html.theme-light .rhv-demo .grid-stack-item-content {
      background: #fff;
      color: #1a2330;
      box-shadow: inset 0 0 0 1px rgba(26, 35, 48, 0.12);
    }
    .rhv-demo .anb-panel__bar {
      height: 22px;
    }
    .rhv-demo .anb-panel__body {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-text-muted);
      font-size: 0.75rem;
    }
    .rhv-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
      align-items: center;
    }
  </style>
</head>
<body>
  <main class="rhv-page" data-testid="resize-handle-variants">
    <h1>Resize handle variants</h1>
    <p class="rhv-lead">
      Стрелки GridStack в углах конфликтовали с × в title bar. Здесь 5 визуальных вариантов × 4 размера.
      Во всех NE/NW сдвинуты <strong>ниже хедера</strong> — крестик свободен.
    </p>
    <p class="rhv-note">
      Живой редактор: тулбар → <code>handle</code> / <code>size</code> (пишется в localStorage).
      Сейчас по умолчанию: <strong>bracket · 14</strong>.
      <a class="link" href="./">← builder</a>
    </p>
    <div class="rhv-actions">
      <button type="button" class="btn btn--secondary" id="rhv-theme" data-testid="rhv-theme">Toggle theme</button>
    </div>
    <div class="rhv-grid" id="rhv-grid"></div>
  </main>
  <script>
    const VARIANTS = [
      { id: 'bracket', label: 'B · bracket', note: 'L-углы, спокойно' },
      { id: 'arrow', label: 'A · arrow', note: 'тихие диагонали (как было)' },
      { id: 'dots', label: 'C · dots', note: '3 точки по диагонали' },
      { id: 'tick', label: 'D · tick', note: 'короткий угол-штрих' },
      { id: 'se', label: 'E · se only', note: 'только правый-низ' },
    ];
    const SIZES = ['12', '14', '16', '20'];

    function tileHtml(variant, size) {
      return (
        '<div class="anb-canvas" data-anb-resize="' + variant + '" data-anb-resize-size="' + size + '">' +
          '<div class="grid-stack">' +
            '<div class="grid-stack-item ui-resizable">' +
              '<div class="grid-stack-item-content">' +
                '<div class="anb-panel__bar">' +
                  '<span class="anb-panel__title">Current status</span>' +
                  '<span class="anb-panel__actions">' +
                    '<button type="button" class="anb-panel__action" tabindex="-1" aria-hidden="true">⎘</button>' +
                    '<button type="button" class="anb-panel__action" tabindex="-1" aria-hidden="true">×</button>' +
                  '</span>' +
                '</div>' +
                '<div class="anb-panel__body">chart</div>' +
              '</div>' +
              '<div class="ui-resizable-handle ui-resizable-nw" style="display:block"></div>' +
              '<div class="ui-resizable-handle ui-resizable-ne" style="display:block"></div>' +
              '<div class="ui-resizable-handle ui-resizable-sw" style="display:block"></div>' +
              '<div class="ui-resizable-handle ui-resizable-se" style="display:block"></div>' +
            '</div>' +
          '</div>' +
        '</div>'
      );
    }

    const root = document.getElementById('rhv-grid');
    const frag = document.createDocumentFragment();
    VARIANTS.forEach((v) => {
      SIZES.forEach((size) => {
        const card = document.createElement('article');
        card.className = 'rhv-card';
        card.innerHTML =
          '<div class="rhv-card__meta"><strong>' + v.label + '</strong> · ' + size + 'px<br>' + v.note + '</div>' +
          '<div class="rhv-demo">' + tileHtml(v.id, size) + '</div>';
        frag.appendChild(card);
      });
    });
    root.appendChild(frag);

    /* Force visible handles in matrix (no hover needed). */
    document.querySelectorAll('.rhv-demo .ui-resizable-handle').forEach((el) => {
      el.style.opacity = '1';
    });

    document.getElementById('rhv-theme')?.addEventListener('click', () => {
      document.documentElement.classList.toggle('theme-light');
    });
  </script>
</body>
</html>
