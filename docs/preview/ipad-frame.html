<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>iPad Pro 13″ landscape frame</title>
  <style>
    :root {
      /* iPad Pro 13″ landscape — CSS px screen 1376×1032 */
      --screen-w: 1376px;
      --screen-h: 1032px;
      --bezel: 26px;
      --radius-outer: 42px;
      --radius-screen: 14px;
      --chassis: #1f1f22;
      --chassis-hi: #35353b;
      --chassis-lo: #0e0e10;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: transparent;
      padding: 64px 56px;
    }
    .stage {
      /* room for protruding side buttons in the screenshot crop */
      padding: 8px 10px;
    }
    .device {
      position: relative;
      width: calc(var(--screen-w) + var(--bezel) * 2);
      height: calc(var(--screen-h) + var(--bezel) * 2);
      padding: var(--bezel);
      border-radius: var(--radius-outer);
      background:
        linear-gradient(155deg, var(--chassis-hi) 0%, var(--chassis) 48%, var(--chassis-lo) 100%);
      box-shadow:
        inset 0 1.5px 0 rgba(255, 255, 255, 0.22),
        inset 0 -2px 0 rgba(0, 0, 0, 0.55),
        inset 1px 0 0 rgba(255, 255, 255, 0.08),
        inset -1px 0 0 rgba(0, 0, 0, 0.4),
        0 36px 70px rgba(0, 0, 0, 0.3),
        0 10px 22px rgba(0, 0, 0, 0.18);
    }
    /* Power button — landscape right edge */
    .btn-power {
      position: absolute;
      right: -5px;
      top: 150px;
      width: 5px;
      height: 88px;
      border-radius: 2px;
      background: linear-gradient(180deg, #5a5a62, #222226 40%, #111114);
      box-shadow: -1px 0 0 rgba(0, 0, 0, 0.5), 1px 0 0 rgba(255, 255, 255, 0.05);
    }
    /* Volume buttons — landscape left edge */
    .btn-vol-up, .btn-vol-down {
      position: absolute;
      left: -5px;
      width: 5px;
      height: 56px;
      border-radius: 2px;
      background: linear-gradient(180deg, #5a5a62, #222226 40%, #111114);
      box-shadow: 1px 0 0 rgba(0, 0, 0, 0.5), -1px 0 0 rgba(255, 255, 255, 0.05);
    }
    .btn-vol-up { top: 160px; }
    .btn-vol-down { top: 228px; }
    .screen {
      position: relative;
      width: var(--screen-w);
      height: var(--screen-h);
      border-radius: var(--radius-screen);
      overflow: hidden;
      background: #000;
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.8),
        inset 0 0 0 1px rgba(255, 255, 255, 0.04);
    }
    .screen img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
    }
    /* Front camera — top long edge center (landscape) */
    .camera {
      position: absolute;
      top: 8px;
      left: 50%;
      width: 11px;
      height: 11px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(circle at 32% 30%, #3a3a44 0%, #121218 55%, #000 100%);
      box-shadow: 0 0 0 2px #0a0a0c, 0 0 0 3.5px #26262c;
      z-index: 4;
    }
    .home-indicator {
      position: absolute;
      left: 50%;
      bottom: 8px;
      width: 180px;
      height: 5px;
      transform: translateX(-50%);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.5);
      z-index: 4;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="stage" id="device">
    <div class="device">
      <span class="btn-power" aria-hidden="true"></span>
      <span class="btn-vol-up" aria-hidden="true"></span>
      <span class="btn-vol-down" aria-hidden="true"></span>
      <span class="camera" aria-hidden="true"></span>
      <div class="screen">
        <img src="readme_images/anb-ipad13pro-screen.png" alt="ANB on iPad Pro 13 landscape" />
        <div class="home-indicator" aria-hidden="true"></div>
      </div>
    </div>
  </div>
</body>
</html>
