name: Allure Notifications
description: >
  Send a collage from an existing Allure report to Telegram and other
  messengers. This Action never generates the report.
author: qa-guru
branding:
  icon: bell
  color: orange

inputs:
  config:
    description: Path to a static notifications config JSON
    required: true
  allure-folder:
    description: Existing Allure report folder, relative to working-directory
    required: false
    default: ""
  allure-results-folder:
    description: Allure results folder, relative to working-directory
    required: false
    default: ""
  project:
    description: Notification project name
    required: false
    default: ""
  report-url:
    description: Published Allure report URL
    required: false
    default: ""
  dashboard-url:
    description: Dashboard URL
    required: false
    default: ""
  testops-url:
    description: Allure TestOps launch URL
    required: false
    default: ""
  build-url:
    description: CI build URL
    required: false
    default: ""
  mode:
    description: Messenger mode (dry-run, mock, or live)
    required: false
    default: dry-run
  out:
    description: Output collage PNG path, relative to working-directory
    required: false
    default: collage.png
  working-directory:
    description: Consumer directory used to resolve config, overrides, and out
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: 26

    - name: Send allure-notifications
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        AN_CONFIG: ${{ inputs.config }}
        AN_ALLURE_FOLDER: ${{ inputs.allure-folder }}
        AN_ALLURE_RESULTS_FOLDER: ${{ inputs.allure-results-folder }}
        AN_PROJECT: ${{ inputs.project }}
        AN_REPORT_URL: ${{ inputs.report-url }}
        AN_DASHBOARD_URL: ${{ inputs.dashboard-url }}
        AN_TESTOPS_URL: ${{ inputs.testops-url }}
        AN_BUILD_URL: ${{ inputs.build-url }}
        AN_MODE: ${{ inputs.mode }}
        AN_OUT: ${{ inputs.out }}
      run: |
        set -euo pipefail

        case "${AN_MODE}" in
          dry-run|mock|live) ;;
          *)
            echo "Invalid mode=${AN_MODE} (expected dry-run|mock|live)" >&2
            exit 1
            ;;
        esac

        args=(send --config "${AN_CONFIG}" "--${AN_MODE}" --out "${AN_OUT}")
        append_if_set() {
          if [[ -n "$2" ]]; then
            args+=("$1" "$2")
          fi
        }
        append_if_set --allure-folder "${AN_ALLURE_FOLDER}"
        append_if_set --allure-results-folder "${AN_ALLURE_RESULTS_FOLDER}"
        append_if_set --project "${AN_PROJECT}"
        append_if_set --report-url "${AN_REPORT_URL}"
        append_if_set --dashboard-url "${AN_DASHBOARD_URL}"
        append_if_set --testops-url "${AN_TESTOPS_URL}"
        append_if_set --build-url "${AN_BUILD_URL}"

        local_cli="${GITHUB_ACTION_PATH}/packages/cli/dist/src/bin.js"
        if [[ -f "${local_cli}" ]]; then
          node "${local_cli}" "${args[@]}"
        else
          npx --yes "allure-notifications@6.0.13" "${args[@]}"
        fi
